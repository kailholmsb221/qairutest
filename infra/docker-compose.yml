# Project name is distinct from other stacks on the host; host ports avoid 5432/8080 which are often taken.
name: campuslive-map

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuslive
      POSTGRES_PASSWORD: campuslive
      POSTGRES_DB: campuslive
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslive -d campuslive"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://campuslive:campuslive@postgres:5432/campuslive?sslmode=disable
      CORS_ORIGINS: http://localhost:3000,https://localhost:8443
      CLOCK_MODE: ${CLOCK_MODE:-real}
      CLOCK_FIXED_AT: ${CLOCK_FIXED_AT:-}
      CLOCK_OFFSET: ${CLOCK_OFFSET:-0s}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      MIGRATE_ON_START: "true"
      SEED_ON_START: "true"
      MAP_PATH: /app/map-data/building-a.json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-compose}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8090}:8080"
    profiles: [full]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090}
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090}
      PORT: "3000"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    profiles: [full]

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "8443:8443"
    depends_on:
      - web
      - api
    profiles: [full]

volumes:
  pgdata:
  caddy_data:
