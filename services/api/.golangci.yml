version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    paths:
      - internal/httpapi/gen.go
      - internal/repo/db
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/httpapi/gen.go
      - internal/repo/db
