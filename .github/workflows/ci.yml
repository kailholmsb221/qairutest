name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/httpapi/gen.go
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: services/api
      - name: test (race, coverage)
        run: |
          go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1
      - name: engine coverage ≥ 95%
        run: |
          go test ./internal/engine -coverprofile=engine.out >/dev/null
          pct=$(go tool cover -func=engine.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "engine coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p >= 95) ? 0 : 1 }'

  web:
    name: web (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: map-data artifacts are up to date
        run: pnpm --filter @campuslive/map-data check
      - name: contract types are up to date
        run: pnpm --filter @campuslive/contracts check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @campuslive/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8090
          API_URL: http://localhost:8090

  e2e:
    name: e2e (playwright, fixed clock)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campuslive
          POSTGRES_PASSWORD: campuslive
          POSTGRES_DB: campuslive
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U campuslive" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://campuslive:campuslive@localhost:5434/campuslive?sslmode=disable
      CLOCK_MODE: fixed
      CLOCK_FIXED_AT: 2026-09-15T10:47:00+05:00
      ADMIN_API_KEY: e2e-admin-key
      NEXT_PUBLIC_ADMIN_API_KEY: e2e-admin-key
      PORT: 8090
      API_URL: http://localhost:8090
      NEXT_PUBLIC_API_URL: http://localhost:8090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: seed
        run: cd services/api && go run ./cmd/seed
      - name: start api
        run: cd services/api && (go run ./cmd/api > /tmp/api.log 2>&1 &) && for i in $(seq 1 30); do curl -fs localhost:8090/readyz && break || sleep 1; done
      - run: pnpm --filter @campuslive/web exec playwright install --with-deps chromium
      - run: pnpm --filter @campuslive/web build
      - run: pnpm --filter @campuslive/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
